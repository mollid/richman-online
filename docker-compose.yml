services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: richman
      POSTGRES_PASSWORD: richman
      POSTGRES_DB: richman
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U richman']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 2567
      DATABASE_URL: postgres://richman:richman@db:5432/richman
      REDIS_URL: redis://redis:6379/0
      RICHMAN_TEST_MODE: '1' # 测试钩子开关：允许 e2e 直接触发终局验证战绩链路
    ports:
      - '2567:2567'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  pgdata:

