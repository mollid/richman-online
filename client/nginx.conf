server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # fonts.css 是渲染阻塞资源，未压缩时约 90KB（里面是上万个 unicode-range 区间）。
    # nginx 默认 gzip off，等于白白多发 3 倍流量；字体本身已是 woff2 压缩格式，不必再 gzip。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API 反代到对战服务器（账号/房间列表/排行榜）
    location /api/ {
        proxy_pass http://server:2567;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 带 content-hash 的构建产物：长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 自托管字体：文件名不含内容哈希，但只在重建字体时才变，给 30 天足够。
    # woff2 已是压缩格式，浏览器解压后可长期复用，避免每次进游戏重下 300KB 热片。
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 入口页绝不缓存，避免发版后引用旧资源哈希
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
